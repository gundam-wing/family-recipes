name: Deploy to GitHub Pages

# Deployments must come from main — the github-pages environment only allows that branch.
# PR updates are handled by preview-trigger.yml, which dispatches this workflow on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      comment_pr:
        description: Optional PR number to comment with the preview URL after deploy
        required: false
        type: string

concurrency:
  group: pages-deployment
  cancel-in-progress: false

# Default token is read-only. A job-level permissions block replaces this
# entirely, so each job below lists only the scopes it uses.
# build runs npm lifecycle scripts from checked-out commits and must not be
# able to deploy Pages, mint an OIDC token, or comment on pull requests.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Build production site from main
        env:
          PATH_PREFIX: /family-recipes
        run: |
          git fetch --force origin main:refs/remotes/origin/main
          git checkout --force origin/main
          npm ci
          npm run build
          rm -rf _site
          mkdir -p _site
          cp -a dist/. _site/

      - name: Build open PR previews
        env:
          GH_TOKEN: ${{ github.token }}
          PATH_PREFIX_ROOT: /family-recipes/preview
        run: |
          set -euo pipefail
          # Fork pull requests are untrusted: npm ci / npm run build would
          # execute their scripts. Only heads in this repository are built.
          filter='.[] | [(if .head.repo.full_name == "gundam-wing/family-recipes" then "build" else "skip" end), (.number | tostring), (.head.repo.full_name // "")] | @tsv'
          rows="$(gh api "repos/${{ github.repository }}/pulls" --paginate --jq "$filter")"

          built=0
          while IFS=$'\t' read -r action pr head_repo; do
            [[ -z "${action:-}" ]] && continue
            if [[ "$action" != "build" ]]; then
              echo "Skipping PR #${pr} from '${head_repo:-unknown}' (head repo is not gundam-wing/family-recipes)."
              continue
            fi
            if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
              echo "Refusing to build unexpected pull request id: ${pr}"
              exit 1
            fi
            built=1
            echo "::group::Preview for PR #${pr}"
            git fetch --force origin "pull/${pr}/head:refs/heads/pr-${pr}"
            git checkout --force "pr-${pr}"
            npm ci
            PATH_PREFIX="${PATH_PREFIX_ROOT}/${pr}" npm run build
            rm -rf "_site/preview/${pr}"
            mkdir -p "_site/preview/${pr}"
            cp -a dist/. "_site/preview/${pr}/"
            echo "::endgroup::"
          done <<< "$rows"

          if [[ "$built" -eq 0 ]]; then
            echo "No open pull requests from gundam-wing/family-recipes; skipping preview builds."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  comment:
    permissions:
      pull-requests: write
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.comment_pr != ''
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.comment_pr }}
          PREVIEW_URL: https://gundam-wing.github.io/family-recipes/preview/${{ inputs.comment_pr }}/
        run: |
          marker="<!-- preview-deploy-bot -->"
          body="$(printf '%s\n### Preview deployment\n\n%s\n\n%s\n' "$marker" "$PREVIEW_URL" "_Rebuilt on each push. Removed automatically when this PR is closed._")"
          existing="$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)"
          if [[ -n "$existing" ]]; then
            gh api "repos/${{ github.repository }}/issues/comments/${existing}" -X PATCH -f body="$body" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$body"
          fi
